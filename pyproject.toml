# Generated by scripts/sync_public.py in the course repository. Do not edit.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linattn"
version = "0.1.0"
description = "Reference implementations of linear attention: parallel, recurrent, chunkwise, and a Triton kernel. Teaching library for a 90+90 min course unit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # torch >= 2.4 is a hard floor: nn.RMSNorm needs it, and torch hard-pins
    # Triton per release (triton 3.0 ships with torch 2.4), so the `gpu` extra
    # below is incompatible with any lower floor.
    "torch>=2.4",
]

[project.optional-dependencies]
# Triton has no macOS or Windows wheels, so the marker keeps `pip install .`
# working there. The homework never imports Triton and never needs this extra.
gpu = ["triton>=3.0; sys_platform == 'linux'"]
plot = ["matplotlib>=3.7", "numpy>=1.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/linattn"]
